<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#213943">
<title>Assistant – Portrait interactif de l’Énergie</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#23343d;background:#eef1f3}
*{box-sizing:border-box}html{width:100%;height:100%}body{margin:0;padding:0;width:100%;min-height:100%}
button,textarea{font:inherit}button{cursor:pointer}
.shell{width:100%;max-width:470px;height:100vh;height:100dvh;max-height:850px;margin:auto;display:flex;flex-direction:column;background:white;overflow:hidden;box-shadow:0 8px 28px rgba(29,52,60,.13)}
.head{background:#213943;color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;flex-shrink:0}
.drop{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:#f0e222;color:#23343d;border-radius:10px;font-size:21px;flex-shrink:0}
.head-title{flex:1;min-width:0}.head strong{display:block;font-size:14px;line-height:1.4}.head small{display:block;margin-top:3px;font-size:11px;color:#cfe1e4}
.reset{background:transparent;color:#e7eeee;border:1px solid #6c848b;padding:7px 10px;border-radius:7px;font-size:12px;flex-shrink:0}
.messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 15px;background:#f4f7f8;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg{max-width:93%;padding:12px 13px;border-radius:13px;font-size:13px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#fff;border:1px solid #dce5e9;border-top-left-radius:3px}.user{align-self:flex-end;background:#f0e222;color:#1e2c34;border-top-right-radius:3px}
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;border-top:1px solid #e8ecee;background:#fff;flex-shrink:0;max-height:108px;overflow-y:auto}
.quick button{border:1px solid #cddce2;border-radius:17px;background:#fff;color:#244050;padding:8px 11px;font-size:11px;font-weight:500;white-space:nowrap}.quick button:hover{background:#f5f0c5;border-color:#e8d92a}
.entry{display:flex;align-items:flex-end;gap:8px;padding:10px;border-top:1px solid #e4eaed;background:#fff;flex-shrink:0}
.entry textarea{flex:1;min-width:0;resize:none;min-height:44px;max-height:110px;padding:12px;border:1px solid #ccd7da;border-radius:9px;font-size:14px;line-height:1.4;outline:none}.entry textarea:focus{border-color:#849da6}
.entry button{border:none;background:#f0e222;color:#1b262b;border-radius:9px;min-height:44px;padding:0 14px;font-size:13px;font-weight:bold;flex-shrink:0}.entry button:hover{background:#e2d619}
.disclaimer{flex-shrink:0;background:#fff;color:#657983;text-align:center;font-size:10px;padding:0 10px 8px}.disclaimer a{color:#244050}
@media(min-width:601px){body{padding:8px}.shell{border-radius:13px;height:calc(100vh - 16px);height:calc(100dvh - 16px)}}
@media(max-width:600px){html,body{width:100%;height:100%;overflow:hidden}.shell{width:100%;max-width:none;height:100vh;height:100dvh;max-height:none;min-height:0;margin:0;border-radius:0;box-shadow:none}.head{padding:12px 13px;gap:10px}.messages{padding:13px 11px;gap:10px}.msg{max-width:92%;font-size:13px;padding:10px 11px}.quick{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;padding:9px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.quick button{flex:0 0 auto}.entry{padding:9px 10px}}
@media(max-width:390px){.head{padding:10px;gap:8px}.drop{width:34px;height:34px;font-size:18px}.head strong{font-size:12px}.head small{font-size:10px}.reset{padding:6px 8px;font-size:11px}.msg{font-size:12.5px}.entry textarea{font-size:16px}.entry button{padding:0 11px}}
@media(max-height:480px){.head{padding-top:8px;padding-bottom:8px}.drop{width:32px;height:32px}.messages{padding:9px 11px}.quick{padding:6px 10px}.entry{padding:6px 10px}}
@media(max-width:600px){.head{padding-top:max(12px,env(safe-area-inset-top))}.entry{padding-bottom:max(10px,env(safe-area-inset-bottom))}}
button:focus-visible,textarea:focus-visible{outline:2px solid #213943;outline-offset:2px}
</style>
</head>
<body>
<main class="shell" aria-label="Assistant du Portrait de l’Énergie">
<header class="head"><span class="drop" aria-hidden="true">⚡</span><div class="head-title"><strong>Assistant du Portrait de l’Énergie</strong><small>Aide à la navigation et à l’utilisation du portrait</small></div><button class="reset" id="reset" type="button">Effacer</button></header>
<section id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></section>
<nav id="quick" class="quick" aria-label="Questions rapides"></nav>
<form class="entry" id="form"><textarea id="question" rows="1" maxlength="600" required aria-label="Posez votre question" placeholder="Posez votre question…"></textarea><button type="submit">Envoyer</button></form>

</main>
<script>
'use strict';
const FAQ=[
  {
    "title": "Utiliser les filtres",
    "keys": [
      "filtre",
      "filtres",
      "filtrer",
      "selection",
      "selectionner",
      "choisir",
      "territoire",
      "gauche",
      "utiliser les filtres"
    ],
    "answer": "Les filtres se trouvent à gauche de la carte ou du tableau de bord, lorsqu’ils sont disponibles.\n\n1. Ouvrez l’onglet qui vous intéresse.\n2. Repérez les filtres dans le panneau de gauche.\n3. Choisissez la ou les valeurs proposées pour affiner l’affichage.\n4. Modifiez ou effacez votre sélection pour revenir aux résultats initiaux.\n\nLes filtres disponibles peuvent varier d’un onglet à l’autre."
  },
  {
    "title": "Afficher les couches",
    "keys": [
      "couche",
      "couches",
      "cocher",
      "decocher",
      "afficher",
      "masquer",
      "activer",
      "desactiver",
      "panneau des couches",
      "afficher les couches"
    ],
    "answer": "Dans les onglets qui présentent une carte, le panneau des couches se trouve à droite de la carte.\n\nOuvrez ce panneau, puis cochez ou décochez les couches que vous souhaitez afficher ou masquer. Vous pouvez ainsi comparer les informations cartographiques proposées.\n\nLes onglets « Tableau de bord » ne présentent pas de carte : ils ne disposent donc pas de ce panneau de couches cartographiques."
  },
  {
    "title": "Lire la légende",
    "keys": [
      "legende",
      "couleur",
      "couleurs",
      "symbole",
      "symboles",
      "lire la legende",
      "signification",
      "representation"
    ],
    "answer": "Dans les onglets cartographiques, la légende est située à droite de la carte. Elle explique la signification des couleurs, symboles et figurés utilisés.\n\nSi vous changez les couches visibles, reportez-vous à la légende correspondante. Les onglets « Tableau de bord » n’ont pas de légende cartographique puisqu’ils ne présentent pas de carte."
  },
  {
    "title": "Table attributaire",
    "keys": [
      "attributaire",
      "attribut",
      "attributs",
      "table",
      "table attributaire",
      "information",
      "informations",
      "objet",
      "clic",
      "cliquer",
      "entite",
      "details",
      "popup"
    ],
    "answer": "Dans un onglet cartographique, cliquez sur un objet représenté sur la carte pour consulter les informations qui lui sont associées, si une fenêtre d’informations est configurée.\n\nLorsque l’onglet propose une table attributaire, ouvrez-la pour consulter les enregistrements et leurs champs. Les outils disponibles peuvent être différents selon les cartes.\n\nPour les onglets « Tableau de bord », consultez directement les chiffres, indicateurs et graphiques affichés."
  },
  {
    "title": "Tableaux de bord",
    "keys": [
      "tableau de bord",
      "tableaux de bord",
      "dashboard",
      "graphique",
      "graphiques",
      "indicateur",
      "indicateurs",
      "chiffres",
      "statistique",
      "statistiques",
      "sans carte"
    ],
    "answer": "Certains onglets du Portrait de l’Énergie sont des tableaux de bord et non des cartes. Ils présentent les informations sous forme de chiffres, d’indicateurs ou de graphiques.\n\nPour les utiliser, ouvrez l’onglet concerné, examinez les indicateurs affichés et utilisez les filtres proposés à gauche lorsqu’il y en a. Il n’y a pas de panneau de couches ni de légende cartographique dans ces onglets."
  },
  {
    "title": "Naviguer sur la carte",
    "keys": [
      "zoom",
      "zoomer",
      "dezoomer",
      "deplacer",
      "navigation",
      "recentrer",
      "molette",
      "carte",
      "dezoom"
    ],
    "answer": "Dans un onglet qui contient une carte, utilisez les commandes de zoom ou la molette de la souris pour agrandir ou réduire la vue. Faites glisser la carte pour vous déplacer.\n\nLes filtres se trouvent à gauche ; les couches et la légende sont à droite. Les onglets de type tableau de bord se consultent sans navigation cartographique."
  },
  {
    "title": "Réinitialiser les filtres",
    "keys": [
      "reinitialiser",
      "effacer",
      "annuler",
      "remettre a zero",
      "supprimer un filtre",
      "retour",
      "tout afficher"
    ],
    "answer": "Pour retrouver l’affichage initial, retournez aux filtres situés à gauche et effacez ou réinitialisez les sélections en cours, selon les commandes proposées dans l’onglet. Vous pourrez ensuite effectuer une nouvelle sélection."
  },
  {
    "title": "Thèmes du portrait",
    "keys": [
      "energie",
      "energies",
      "renouvelable",
      "renouvelables",
      "zaenr",
      "eolien",
      "solaire",
      "photovoltaique",
      "methanisation",
      "geothermie",
      "bois energie",
      "hydroelectricite",
      "chaleur",
      "theme",
      "thematiques"
    ],
    "answer": "Le Portrait de l’Énergie rassemble plusieurs visualisations autour des données et enjeux énergétiques du territoire. Selon l’onglet choisi, les informations peuvent apparaître sur une carte ou dans un tableau de bord.\n\nDans les cartes, utilisez les filtres à gauche et les couches et la légende à droite. Dans les tableaux de bord, consultez les indicateurs et les éventuels filtres proposés."
  },
  {
    "title": "Problème d’affichage",
    "keys": [
      "probleme",
      "erreur",
      "bug",
      "vide",
      "blanc",
      "chargement",
      "lent",
      "ne fonctionne pas",
      "impossible",
      "rien ne saffiche"
    ],
    "answer": "Si un onglet ne s’affiche pas correctement, vérifiez d’abord les filtres en cours, puis actualisez la page et contrôlez votre connexion Internet. Si besoin, essayez un autre navigateur.\n\nSur les cartes, vérifiez aussi que les couches souhaitées sont cochées dans le panneau de droite."
  },
  {
    "title": "Utilisation sur mobile",
    "keys": [
      "mobile",
      "telephone",
      "smartphone",
      "tablette",
      "tactile"
    ],
    "answer": "Sur téléphone ou tablette, ouvrez l’onglet souhaité. Pour une carte, utilisez les gestes tactiles pour zoomer et vous déplacer. Les panneaux de filtres, couches et légende peuvent être disposés différemment selon la taille de l’écran. Dans un tableau de bord, faites défiler la page pour consulter les indicateurs."
  },
  {
    "title": "Contacter l’Agence",
    "keys": [
      "contact",
      "contacter",
      "agence",
      "mail",
      "email",
      "signaler"
    ],
    "answer": "Pour contacter L’Agence du Pays de Saint-Omer, consultez son site : https://www.aud-stomer.fr/."
  },
  {
    "title": "Présentation du portrait",
    "keys": [
      "bonjour",
      "salut",
      "aide",
      "presentation",
      "portrait",
      "comment utiliser",
      "fonctionnement",
      "commencer"
    ],
    "answer": "Bienvenue dans le Portrait interactif de l’Énergie de L’Agence du Pays de Saint-Omer ! ⚡\n\nCertains onglets présentent des cartes et d’autres des tableaux de bord. Sur les cartes, les filtres se trouvent à gauche et le panneau des couches ainsi que la légende se trouvent à droite. Pour les tableaux de bord, consultez les indicateurs et utilisez les filtres proposés.\n\nQuelle fonctionnalité souhaitez-vous découvrir ?"
  }
];
const quick=["Utiliser les filtres", "Afficher les couches", "Lire la légende", "Table attributaire"];
const messages=document.getElementById('messages'),quickNav=document.getElementById('quick'),input=document.getElementById('question');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function addMessage(s,kind){const div=document.createElement('div');div.className='msg '+kind;div.textContent=s;messages.appendChild(div);messages.scrollTop=messages.scrollHeight}
function respond(q){
 const s=norm(q), words=s.split(' ');
 const exact=FAQ.find(e=>norm(e.title)===s);
 if(exact)return exact.answer;
 if(/tableau(x)? de bord|dashboard|graphique|indicateur/.test(s))return FAQ.find(e=>e.title==='Tableaux de bord').answer;
 if(/legende|symbole|figur/.test(s))return FAQ.find(e=>e.title==='Lire la légende').answer;
 if(/couche|cocher|decocher|masquer/.test(s))return FAQ.find(e=>e.title==='Afficher les couches').answer;
 if(/attribut|popup|information sur|cliquer sur|clic sur/.test(s))return FAQ.find(e=>e.title==='Table attributaire').answer;
 if(/filtr|selection/.test(s))return FAQ.find(e=>e.title==='Utiliser les filtres').answer;
 let best=null,max=0;
 for(const e of FAQ){let score=0,t=norm(e.title);
   if(s.includes(t)&&t.length>7)score+=12;
   for(const k0 of e.keys){const k=norm(k0);
     if(s===k)score+=30;
     else if(k.includes(' ')&&s.includes(k))score+=14+k.length/10;
     else if(words.includes(k))score+=k.length>=5?5:3;
     else if(k.length>=7&&s.includes(k))score+=3;
   }
   if(score>max){best=e;max=score}
 }
 return max>=3?best.answer:'Je peux vous aider à utiliser les filtres à gauche, les couches et la légende à droite des cartes, les tables attributaires et les onglets de type tableau de bord. Posez-moi une question sur l’un de ces outils.';
}
function ask(q){q=q.trim();if(!q)return;addMessage(q,'user');addMessage(respond(q),'bot')}
for(const q of quick){const b=document.createElement('button');b.type='button';b.textContent=q;b.addEventListener('click',()=>ask(q));quickNav.appendChild(b)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=input.value;input.value='';input.style.height='auto';ask(q);input.focus()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
function intro(){addMessage('Bonjour 👋 Je suis l’assistant du Portrait interactif de l’Énergie de L’Agence.\n\nJe peux vous aider à utiliser les filtres à gauche, le panneau des couches et la légende à droite des cartes, les attributs et les onglets de type tableau de bord.\n\nComment puis-je vous aider ?','bot')}
document.getElementById('reset').addEventListener('click',()=>{messages.replaceChildren();input.value='';intro();input.focus()});
intro();
</script>
</body>
</html>
